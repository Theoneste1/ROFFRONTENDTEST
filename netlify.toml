# Netlify build settings for the ROF LMS frontend (Next.js 16).
#
# Netlify detects Next.js and applies its Next.js runtime automatically
# (no plugin needs to be installed or listed here).
#
# Two Netlify sites build this repository: production (main) and staging (develop). Each must reach ITS OWN backend,
# so the backend address is NOT in this file: set it per site in the Netlify dashboard (Site configuration ->
# Environment variables), then redeploy (read at build time):
#   API_PROXY_TARGET               production: https://rofbackendtest.onrender.com
#                                  staging:    https://rof-backend-staging.onrender.com
#   NEXT_PUBLIC_API_UPLOAD_ORIGIN  the same address as API_PROXY_TARGET
# The build stops with a clear error if either is missing, not https, local, or the two differ.
# See DEPLOYMENT.md (backend: CORS_ORIGINS and APP_URL must be this site's address).

[build]
  # scripts/netlify-redirects.mjs writes public/_redirects from API_PROXY_TARGET: Netlify's CDN proxies /api/* straight
  # to the backend (same origin for the browser, so the SameSite=Strict refresh cookie keeps working; no function cold
  # start; large downloads stream). Locally, next.config.ts's rewrite does the same job.
  command = "node scripts/netlify-redirects.mjs && npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node.js 20.9 or newer.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers for every page (the API responses keep the backend's own headers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
