# Netlify build settings for the ROF LMS frontend (Next.js 16).
#
# Netlify detects Next.js and applies its Next.js runtime automatically
# (no plugin needs to be installed or listed here).
#
# Required environment variable (Site configuration → Environment variables),
# set BEFORE the first build — it is read at build time:
#   API_PROXY_TARGET = https://<your-backend-host>   (no trailing slash, no /api)
# See DEPLOYMENT.md for the full checklist, including the backend settings.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node.js 20.9 or newer.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Security headers for every page (the API responses keep the backend's own headers).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
