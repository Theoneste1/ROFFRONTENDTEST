name: Frontend CI

# Lint, route types, type-check, unit tests and the production build with the
# same settings as Netlify (netlify.toml): a broken build is caught on the PR.

# develop is the integration branch (feature PRs target it); main is the
# production release branch. CI checks both, on pushes and on PRs into them.
# This workflow only checks code — it never deploys.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22        # same as NODE_VERSION in netlify.toml
          cache: npm

      - name: Install dependencies
        run: npm ci               # package-lock.json is committed

      - name: Lint
        run: npm run lint

      # PageProps / LayoutProps are generated into .next/types (gitignored);
      # a fresh checkout has none, so generate them before tsc runs.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # NETLIFY=true runs next.config.ts's hosted-build check, exactly as on Netlify.
      - name: Production build (Netlify settings)
        run: npm run build
        env:
          NETLIFY: "true"
          NEXT_TELEMETRY_DISABLED: "1"
          API_PROXY_TARGET: https://rofbackendtest.onrender.com
          NEXT_PUBLIC_API_UPLOAD_ORIGIN: https://rofbackendtest.onrender.com

      - name: The browser code sends uploads straight to the backend
        run: grep -rq "rofbackendtest.onrender.com" .next/static/chunks
