name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    env:
      API_PROXY_TARGET: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The repository currently has no committed npm lockfile.
      # npm install is used until a lockfile is added and reviewed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # PageProps / LayoutProps are global types that Next.js generates into
      # .next/types (gitignored). A fresh checkout has none, so generate them
      # before tsc runs. See `next typegen` in node_modules/next/dist/docs.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Production build
        run: npm run build
